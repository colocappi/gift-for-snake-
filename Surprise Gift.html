<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Surprise Gift</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one centered gift on a deep violet night; tap it, the lid flies off, the artwork rises out and fills the stage. */
:root {
  --night: #0f0a1f;
  --night-2: #1d1138;
  --violet: #7a52c7;
  --violet-deep: #3b2273;
  --glow: #c77dff;
  --ribbon: #b8cdf0;
  --ribbon-deep: #8fb0e0;
  --text: #d9cff2;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(ellipse at 50% 40%, var(--night-2), var(--night) 70%);
  color: var(--text);
  font-family: var(--font-body);
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  place-items: center;
  box-sizing: border-box;
  overflow-x: hidden;
}
main { width: min(100%, 560px); display: grid; gap: 14px; justify-items: center; }
.gift-btn {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  color: inherit;
  max-width: 100%;
}
.gift-btn.open { cursor: default; }
.gift-btn:focus-visible { outline: 2px solid var(--ribbon); outline-offset: 6px; border-radius: 16px; }
.rays {
  position: absolute; inset: -15%;
  background: radial-gradient(circle, rgba(199,125,255,.6), rgba(199,125,255,0) 60%);
  opacity: 0; transform: scale(.4);
  pointer-events: none;
}
.open .rays { animation: flash 1.4s ease-out forwards; }
@keyframes flash { 0% { opacity: 0; transform: scale(.4); } 25% { opacity: 1; } 100% { opacity: .35; transform: scale(1.1); } }

svg.gift { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.gift-all { transform-box: fill-box; transform-origin: 50% 100%; animation: wiggle 3.6s ease-in-out infinite; }
.open .gift-all { animation: none; }
@keyframes wiggle {
  0%, 78%, 100% { transform: rotate(0); }
  82% { transform: rotate(-3deg); }
  86% { transform: rotate(3deg); }
  90% { transform: rotate(-2deg); }
  94% { transform: rotate(1.5deg); }
}
.lid, .body {
  transform-box: fill-box; transform-origin: 50% 50%;
}
.lid { transition: transform .8s cubic-bezier(.3,.9,.3,1) .35s, opacity .5s ease .5s; }
.body { transition: transform .7s ease .1s, opacity .6s ease .1s; }
.open .lid { transform: translateY(-150px) rotate(-16deg); opacity: 0; transition-delay: 0s, .35s; }
.open .body { transform: translateY(34px) scale(.9); opacity: 0; transition-delay: .55s; }

.art {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  pointer-events: none;
  opacity: 0;
  transform: translateY(22%) scale(.28);
  transition: transform .5s ease, opacity .3s ease;
}
.open .art {
  opacity: 1;
  transform: none;
  transition: transform 1s cubic-bezier(.2,1.25,.4,1) .3s, opacity .4s ease .3s;
}
.art img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 14px;
  box-shadow: 0 0 60px rgba(199,125,255,.45), 0 12px 40px rgba(0,0,0,.5);
}
.caption {
  position: absolute; left: 0; right: 0; bottom: 11%;
  text-align: center;
  font-family: "Pacifico", "Brush Script MT", cursive;
  font-size: clamp(22px, 7vw, 40px);
  color: #e6efff;
  text-shadow: 0 0 14px rgba(199,125,255,.95), 0 2px 8px rgba(0,0,0,.75);
  opacity: 0; transform: translateY(10px);
  transition: opacity .3s ease, transform .3s ease;
}
.open .caption { opacity: 1; transform: none; transition: opacity .7s ease 1.2s, transform .7s ease 1.2s; }
canvas.burst { position: absolute; inset: -20%; width: 140%; height: 140%; pointer-events: none; }
.sign {
  position: absolute; left: 50%; top: 0;
  padding: .3em .9em .4em;
  font-family: "Pacifico", "Brush Script MT", cursive;
  font-size: clamp(34px, 11vw, 64px);
  line-height: 1.1;
  color: #1d1138;
  background: linear-gradient(135deg, #d3e1f7, #9dbbe8);
  border-radius: 18px;
  box-shadow: 0 0 32px rgba(184,205,240,.55), 0 6px 18px rgba(0,0,0,.5);
  white-space: nowrap;
  pointer-events: none;
  transform: translateX(-50%) rotate(-3deg);
  animation: bob 2s ease-in-out infinite;
  transition: opacity .3s ease;
}
.open .sign { opacity: 0; animation: none; }
@keyframes bob {
  0%, 100% { transform: translateX(-50%) translateY(0) rotate(-3deg); }
  50% { transform: translateX(-50%) translateY(-8px) rotate(-3deg); }
}
.hint { margin: 0; font-size: 14px; letter-spacing: .08em; text-transform: lowercase; opacity: .8; min-height: 1.4em; }
.hint.pulse { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) {
  .gift-all, .hint.pulse { animation: none; }
  .lid, .body, .art, .open .lid, .open .body, .open .art { transition-duration: .01s; transition-delay: 0s; }
}
</style>

</main>

<script>
(function () {
  var btn = document.getElementById('gift');
  var hint = document.getElementById('hint');
  var canvas = document.getElementById('burst');
  var ctx = canvas.getContext('2d');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var parts = [], raf = 0;
  var colors = ['#c77dff', '#e879f9', '#b8cdf0', '#ffffff', '#c0213b', '#8a62d8'];

  function size() {
    var r = canvas.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    canvas.width = Math.round(r.width * d);
    canvas.height = Math.round(r.height * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  function burst() {
    if (reduce) return;
    size();
    var r = canvas.getBoundingClientRect();
    var cx = r.width / 2, cy = r.height * 0.52;
    for (var i = 0; i < 90; i++) {
      var a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 7;
      parts.push({
        x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3,
        w: 4 + Math.random() * 6, h: 3 + Math.random() * 5,
        rot: Math.random() * 6, vr: (Math.random() - .5) * .4,
        life: 1, c: colors[i % colors.length]
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    var r = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, r.width, r.height);
    parts = parts.filter(function (p) { return p.life > 0; });
    parts.forEach(function (p) {
      p.vy += 0.18; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 0.012;
      ctx.save();
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    raf = parts.length ? requestAnimationFrame(tick) : 0;
    if (!parts.length) ctx.clearRect(0, 0, r.width, r.height);
  }

  var open = false, closeTimer = 0;
  function setOpen(v) {
    open = v;
    btn.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', String(open));
    btn.setAttribute('aria-label', open ? 'The gift is open' : 'Open the gift');
    hint.classList.toggle('pulse', !open);
    hint.textContent = open ? '' : 'tap the gift';
    if (open) setTimeout(burst, 350);
  }
  btn.addEventListener('click', function () {
    if (!open) setOpen(true);
  });
  // .open class lives on the button; scope rules via it
})();
</script>
